<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">DLMM range bot</title>
  <desc id="desc">An original range-map illustration for a single-sided Solana Meteora DLMM bot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071116"/>
      <stop offset="0.56" stop-color="#101b25"/>
      <stop offset="1" stop-color="#10111b"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#62f0bd"/>
      <stop offset="1" stop-color="#a5f5ed"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#background)"/>
  <path d="M0 500h1600" stroke="#34434a"/>
  <path d="M730 68v364" stroke="#26363c"/>

  <g transform="translate(104 104)">
    <text x="-3" y="178" fill="#f3f5ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="750" letter-spacing="-4">Stay in</text>
    <text x="-3" y="256" fill="#f3f5ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="750" letter-spacing="-4">your range.</text>
    <text x="1" y="307" fill="#a8b9c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Single-sided DLMM. Automatic rebalancing.</text>
  </g>

  <g transform="translate(765 67)">
    <path d="M30 400H710M30 300H710M30 200H710M30 100H710" stroke="#28373e" stroke-width="1"/>
    <path d="M90 40v360M170 40v360M250 40v360M330 40v360M410 40v360M490 40v360M570 40v360M650 40v360" stroke="#26343a" stroke-width="1"/>
    <g>
      <rect x="73" y="322" width="64" height="78" rx="3" fill="#26343a"/>
      <rect x="151" y="284" width="64" height="116" rx="3" fill="#304047"/>
      <rect x="229" y="307" width="64" height="93" rx="3" fill="#35464b"/>
      <rect x="307" y="253" width="64" height="147" rx="3" fill="#62f0bd"/>
      <rect x="385" y="208" width="64" height="192" rx="3" fill="url(#mint)"/>
      <rect x="463" y="269" width="64" height="131" rx="3" fill="#39464b"/>
      <rect x="541" y="314" width="64" height="86" rx="3" fill="#60483f"/>
      <rect x="619" y="340" width="64" height="60" rx="3" fill="#394249"/>
    </g>
    <path d="M417 42v365" stroke="#f3f5ef" stroke-width="2" stroke-dasharray="7 7"/>
    <circle cx="417" cy="208" r="8" fill="#f3f5ef" stroke="#62f0bd" stroke-width="4"/>
    <rect x="351" y="47" width="132" height="31" rx="4" fill="#172127" stroke="#4d6765"/>
    <text x="417" y="67" fill="#dbe7e1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1" text-anchor="middle">ACTIVE BIN</text>
    <path d="M307 430v12h142v-12" fill="none" stroke="url(#mint)" stroke-width="2"/>
    <text x="398" y="467" fill="#9caaa9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2" text-anchor="middle">POSITION RANGE</text>
  </g>
</svg>
